<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Élixir – Parfums d'Exception</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Barre de navigation -->
  <header>
    <nav class="navbar">
      <div class="logo">Élixir</div>
      <ul class="nav-links">
        <li><a href="#">Accueil</a></li>
        <li><a href="#">Collections</a></li>
        <li><a href="#">Inspirations</a></li>
        <li><a href="#">Boutique</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section class="hero">
  <div class="video-background">
    <video autoplay muted loop playsinline>
      <source src="video/parfum.mp4" type="video/mp4">
      Votre navigateur ne supporte pas la vidéo HTML5.
    </video>
  </div>

  <div class="hero-text">
    <h1>Découvrez l'essence du luxe</h1>
    <p>Des parfums rares, des émotions éternelles</p>
    <a href="#" class="cta-button">Explorer</a>
  </div>
</section>


  <!-- Marques -->
  <section class="brands">
    <h2>Nos marques d'exception</h2>
    <div class="brand-grid">
      <div class="brand-card">Chanel</div>
      <div class="brand-card">Dior</div>
      <div class="brand-card">Maison Francis Kurkdjian</div>
    </div>
  </section>

  <!-- Pied de page -->
  <footer>
    <p>&copy; 2025 Élixir. Tous droits réservés.</p>
  </footer>

</body>
</html>
